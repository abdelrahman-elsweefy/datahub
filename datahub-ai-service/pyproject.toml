[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-ai-service"
version = "0.1.0"
description = "Persistent DataHub Ask AI conversations powered by DeepAgents"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.19,<0.8",
    "fastapi>=0.115,<0.129",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff==0.15.22", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
